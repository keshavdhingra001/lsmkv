[package]
name = "lsmkv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the main crate's builds never see it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
lsmkv = { path = ".." }

[[bin]]
name = "wal_replay"
path = "fuzz_targets/wal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_open"
path = "fuzz_targets/manifest_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sstable_read"
path = "fuzz_targets/sstable_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sstable_roundtrip"
path = "fuzz_targets/sstable_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp_parse"
path = "fuzz_targets/resp_parse.rs"
test = false
doc = false
bench = false
