# Planted bugs for scripts/mutate.py. Each `find` must appear exactly once
# in `file`; `tests` are the `cargo test` arguments that must catch it.

# ---- Durability (D28): only the power-loss simulation can see these ----

[[mutant]]
name = "durability: Always mode acks before the WAL fsync"
file = "src/db.rs"
find = '''            if sync {
                wal.sync()?;
            } else {
                wal.flush()?;
            }'''
replace = '''            let _ = sync;
            wal.flush()?;'''
tests = "--release --test sim"
env = { LSMKV_SIM_SEEDS = "2000" }

[[mutant]]
name = "durability: a new WAL's name not made durable"
file = "src/db.rs"
find = '''            let new_wal = Wal::open_in(&*self.opts.fs, &log_path(&self.dir, log_id))?;
            self.opts.fs.sync_dir(&self.dir)?;'''
replace = '''            let new_wal = Wal::open_in(&*self.opts.fs, &log_path(&self.dir, log_id))?;'''
tests = "--release --test sim"
env = { LSMKV_SIM_SEEDS = "2000" }

[[mutant]]
name = "durability: memtable switch skips the old WAL's fsync"
file = "src/db.rs"
find = '''            let before = wal.sync_count();
            wal.sync()?;'''
replace = '''            let before = wal.sync_count();
            wal.flush()?;'''
tests = "--release --test sim"
env = { LSMKV_SIM_SEEDS = "2000" }

