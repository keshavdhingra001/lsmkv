# ---- Correctness of reads, compaction and transactions ----

[[mutant]]
name = "compaction: tombstones always dropped"
file = "src/db/compaction.rs"
find = "if entry == Entry::Tombstone && seq <= env.oldest_snapshot && shadows_nothing {"
replace = "if entry == Entry::Tombstone {"
tests = "--lib db::"

[[mutant]]
name = "snapshots: versions a snapshot needs are garbage collected"
file = "src/key.rs"
find = "let hidden = self.newer_seq <= self.oldest_snapshot;"
replace = "let hidden = self.newer_seq != MAX_SEQ;"
tests = "--lib db::"

[[mutant]]
name = "filters: tombstones left out of the bloom filter"
file = "src/sstable/writer.rs"
find = "if self.opts.bloom_bits_per_key > 0 && new_key {"
replace = "if self.opts.bloom_bits_per_key > 0 && new_key && matches!(entry, Entry::Value(_)) {"
tests = "--lib"

[[mutant]]
name = "transactions: conflicts within one write group missed"
file = "src/db/batch.rs"
find = "let newer = written.contains(key)"
replace = "let newer = false"
tests = "--lib db::batch"

[[mutant]]
name = "transactions: conflict check compares the wrong way"
file = "src/db/batch.rs"
find = "is_some_and(|seq| seq > read_seq)"
replace = "is_some_and(|seq| seq < read_seq)"
tests = "--lib db::batch"

[[mutant]]
name = "wal: mid-log corruption treated as a torn tail"
file = "src/wal.rs"
find = "let is_tail = rest.is_empty() || buf[pos..].iter().all(|&b| b == 0);"
replace = "let is_tail = true;"
tests = "--lib wal::"

