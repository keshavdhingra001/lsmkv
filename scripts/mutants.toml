# ---- D30: restart points in blocks ----

[[mutant]]
name = "D30: seek starts at the restart after the target"
file = "src/sstable/block.rs"
find = "self.iter_at(if lo == 0 { 0 } else { self.restart(lo - 1) })"
replace = "self.iter_at(if lo == 0 { 0 } else { self.restart(lo.min(self.restarts.len() / 4 - 1)) })"
tests = "--lib sstable"

[[mutant]]
name = "D30: restart offsets not checked against entries"
file = "src/sstable/block.rs"
find = '''        if has_restarts {
            block.check_restarts()?;
        }'''
replace = ""
tests = "--lib sstable"

[[mutant]]
name = "D30: footer CRC doesn't cover the magic"
file = "src/sstable/mod.rs"
find = "    if read_u64(buf, 44) == MAGIC {"
replace = "    if false {"
tests = "--lib sstable"

[[mutant]]
name = "D30: old tables read as if they had restart points"
file = "src/sstable/reader.rs"
find = "Block::from_verified(&raw, self.footer.restarts)"
replace = "Block::from_verified(&raw, true)"
tests = "--test compat"

[[mutant]]
name = "D30: a restart point recorded after its entry"
file = "src/sstable/block.rs"
find = '''        if self.count.is_multiple_of(RESTART_INTERVAL) {
            self.restarts.push(len_u32(&self.buf, "block")?);
        }

        self.buf.push(kind);'''
replace = '''        self.buf.push(kind);
        if self.count.is_multiple_of(RESTART_INTERVAL) {
            self.restarts.push(len_u32(&self.buf, "block")?);
        }'''
tests = "--lib sstable"
